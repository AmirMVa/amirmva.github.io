<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرمحمد وهاب نژاد | صفحه شخصی</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config for Custom Colors, Fonts and Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0a0f1c',
                        primary: '#06b6d4', // Cyan/Turquoise
                        secondary: '#2563eb', // Blue
                    },
                    animation: {
                        'blob': 'blob 8s infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0f1c; /* Deep Dark Blue Base */
            font-family: 'Vazirmatn', sans-serif; /* Enforcing Vazirmatn Font */
        }
        
        /* Glassmorphism Card Style */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.05);
        }

        /* Button Hover Effects */
        .btn-link {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-link:hover {
            background: linear-gradient(90deg, rgba(6,182,212,0.1) 0%, rgba(37,99,235,0.1) 100%);
            border-color: rgba(6, 182, 212, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.2);
        }

        /* Animation Delays for Staggered Loading */
        .delay-100 { animation-delay: 100ms; opacity: 0; }
        .delay-200 { animation-delay: 200ms; opacity: 0; }
        .delay-300 { animation-delay: 300ms; opacity: 0; }
        .delay-400 { animation-delay: 400ms; opacity: 0; }
        .delay-500 { animation-delay: 500ms; opacity: 0; }
        .delay-600 { animation-delay: 600ms; opacity: 0; }

        /* Custom Scrollbar for smaller devices if needed */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen text-slate-200 font-sans flex items-center justify-center relative overflow-hidden p-4 sm:p-8">

    <!-- Animated Background Gradients (Blobs) -->
    <div class="absolute top-0 right-1/4 w-72 h-72 bg-secondary/30 rounded-full mix-blend-screen filter blur-[80px] opacity-70 animate-blob z-0"></div>
    <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-primary/20 rounded-full mix-blend-screen filter blur-[80px] opacity-70 animate-blob z-0" style="animation-delay: 2s;"></div>
    <div class="absolute bottom-1/4 right-1/3 w-64 h-64 bg-indigo-600/20 rounded-full mix-blend-screen filter blur-[80px] opacity-70 animate-blob z-0" style="animation-delay: 4s;"></div>

    <!-- Main Container -->
    <main class="glass-panel w-full max-w-md rounded-[2.5rem] p-8 sm:p-10 z-10 relative flex flex-col items-center animate-fade-in-up">
        
        <!-- Profile Image / Avatar -->
        <div class="relative mb-6 animate-fade-in-up delay-100">
            <!-- Glow Effect behind Avatar -->
            <div class="absolute inset-0 bg-gradient-to-tr from-primary to-secondary rounded-full blur-md opacity-60"></div>
            <!-- Avatar Container -->
            <div class="relative w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-primary to-secondary flex items-center justify-center">
                <img src="Picsart_26-08-10_22-18-30-201.jpg" alt="تصویر امیرمحمد" class="w-full h-full rounded-full object-cover">
            </div>
            <!-- Badge (Microsoft Theme) -->
            <div class="absolute bottom-0 right-0 w-8 h-8 bg-slate-800 border-2 border-dark rounded-full flex items-center justify-center shadow-lg">
                <i class="ph-fill ph-windows-logo text-cyan-400 text-sm"></i>
            </div>
        </div>

        <!-- Name & Bio -->
        <div class="text-center mb-10 w-full animate-fade-in-up delay-200">
            <h1 class="text-2xl sm:text-3xl font-extrabold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-blue-600">
                امیرمحمد وهاب نژاد

            <p class="text-slate-400 text-sm sm:text-base font-light leading-relaxed px-4">
                جویای دانش در دنیای وسیع ماکروسافت
            </p>
        </div>

        <!-- Links Section -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- LinkedIn Button -->
            <a href="https://www.linkedin.com/in/amirmohammad-vahabnezhad-b88648427/" target="_blank" class="btn-link group flex items-center justify-between w-full p-4 rounded-2xl border border-slate-700/50 bg-slate-800/40 animate-fade-in-up delay-300 relative overflow-hidden">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="w-12 h-12 rounded-xl bg-blue-600/10 text-blue-400 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-all duration-300 shadow-inner">
                        <i class="ph ph-linkedin-logo text-2xl"></i>
                    </div>
                    <span class="text-slate-200 font-semibold text-[1.05rem]">لینکدین من</span>
                </div>
                <i class="ph ph-caret-left text-slate-500 group-hover:text-cyan-400 transition-colors relative z-10"></i>
            </a>

            <!-- Telegram Button -->
            <!-- Note: Replace the href with your actual Telegram link (e.g., https://t.me/yourusername) -->
            <a href="https://t.me/TeIIMeHow" target="_blank" class="btn-link group flex items-center justify-between w-full p-4 rounded-2xl border border-slate-700/50 bg-slate-800/40 animate-fade-in-up delay-400 relative overflow-hidden">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="w-12 h-12 rounded-xl bg-cyan-600/10 text-cyan-400 flex items-center justify-center group-hover:bg-cyan-500 group-hover:text-white transition-all duration-300 shadow-inner">
                        <i class="ph ph-telegram-logo text-2xl"></i>
                    </div>
                    <span class="text-slate-200 font-semibold text-[1.05rem]">ارتباط در تلگرام</span>
                </div>
                <i class="ph ph-caret-left text-slate-500 group-hover:text-cyan-400 transition-colors relative z-10"></i>
            </a>

            <!-- Phone Button -->
            <!-- Note: Replace the href with your actual phone number -->
            <a href="tel:+989999034326" class="btn-link group flex items-center justify-between w-full p-4 rounded-2xl border border-slate-700/50 bg-slate-800/40 animate-fade-in-up delay-500 relative overflow-hidden">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="w-12 h-12 rounded-xl bg-teal-500/10 text-teal-400 flex items-center justify-center group-hover:bg-teal-500 group-hover:text-white transition-all duration-300 shadow-inner">
                        <i class="ph ph-phone-call text-2xl"></i>
                    </div>
                    <span class="text-slate-200 font-semibold text-[1.05rem]">تماس تلفنی</span>
                </div>
                <i class="ph ph-caret-left text-slate-500 group-hover:text-cyan-400 transition-colors relative z-10"></i>
            </a>
            
        </div>
        
    </main>

</body>
</html>
